# Frame-reference example: coordinate frames only, not artificial equipment.
scene_usd: experiments/config/liquid/seed_frames.usda
add_ground_plane: true
parameters:
  spacing: 0.004
volumes:
  - root_path: /World/Left/Water
    frame_path: /World/Left
    shape: box
    center: [0, 0, 0.15]
    size: [0.04, 0.04, 0.04]
  - root_path: /World/Right/Water
    frame_path: /World/Right
    shape: cylinder
    center: [0, 0, 0.15]
    radius: 0.02
    height: 0.04
    parameters:
      color: [0.1, 0.55, 0.3]
preview:
  eye: [0.35, -0.45, 0.4]
  target: [0, 0, 0.10]
  focal_length_mm: 35
  sensor_width_mm: 36
