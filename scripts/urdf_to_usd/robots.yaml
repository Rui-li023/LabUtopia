  - name: yaskawa_hc10_robotiq85
    vendor: Yaskawa + Robotiq
    repo: motoman
    package: motoman_hc10_support
    source_file: scripts/urdf_to_usd/xacro_overlays/yaskawa_hc10_robotiq85.xacro
    extra_repos: [arx_common]
    preview_pose: [0.0, -0.65, -0.6, 0.0, 1.15, 0.0]
    reach_m: 1.33
    visual_meshes: dae

  - name: techman_tm5_900_robotiq85
    vendor: Techman + Robotiq
    repo: tmr_ros1
    package: tm_description
    source_file: scripts/urdf_to_usd/xacro_overlays/techman_tm5_900_robotiq85.xacro
    extra_repos: [arx_common]
    strip_visual_materials: true
    # Isaac derives mesh prim names from the filename. Techman's hyphenated stems
    # (for example tm5-base.obj) are invalid Sdf identifiers unless aliased.
    sanitize_mesh_filenames: true
    preview_pose: [0.0, -0.65, -0.6, 0.0, 1.15, 0.0]
    reach_m: 1.03
    visual_meshes: obj

  - name: unitree_z1
    vendor: Unitree
    repo: z1_ros
    package: z1_description
    source_file: scripts/urdf_to_usd/xacro_overlays/unitree_z1.xacro
    args:
      UnitreeGripper: "true"
    finger_collider_preset: unitree_z1
    finger_collider_force: true
    # Unitree's authoritative ROS DAE files define no materials, and the independent
    # MuJoCo Menagerie conversion derived from them is intentionally one neutral grey
    # as well. One colour is therefore source-faithful, not a lost-material symptom.
    min_material_colors: 1
    preview_pose: [0.0, 1.0, -1.5, 0.2, 0.0, 0.0, -1.2]
    reach_m: 0.80
    visual_meshes: dae

  - name: widowx_vx300s
    vendor: Trossen / Interbotix
    repo: interbotix
    package: interbotix_xsarm_descriptions
    source: urdf/vx300s.urdf.xacro
    reach_m: 0.75
    visual_meshes: stl

  # --- requested models with no official NVIDIA asset -------------------------
  - name: arx_x5
    vendor: ARX
    repo: arx
    package: arx5_description
    source: xacro/robot.xacro
    extra_repos: [arx_common]
    args:
      type: x5
    # ARX's GLB files are Y-up; URDF and Isaac Sim are Z-up.
    visual_rpy: [-1.5707963267948966, 0, 0]
    reach_m: 0.62
    visual_meshes: glb

  - name: arx_r5
    vendor: ARX
    repo: arx
    package: arx5_description
    source: xacro/robot.xacro
    extra_repos: [arx_common]
    args:
      type: r5
    # ARX's GLB files are Y-up; URDF and Isaac Sim are Z-up.
    visual_rpy: [-1.5707963267948966, 0, 0]
    reach_m: 0.62
    visual_meshes: glb

  - name: arx_lift2s
    vendor: ARX
    repo: arx
    package: arx_lift2s_description
    source: xacro/robot.xacro
    extra_repos: [arx_common]
    reach_m: 1.20
    visual_meshes: glb

  - name: split_aloha
    vendor: AgileX
    repo: mobile_aloha
    package: arx5_description
    source: urdf/arx5_description_isaac.urdf
    reach_m: 1.20
    visual_meshes: stl

  # The in-repo piper.usd came from a 20x STL URDF (flat colour). This source has
  # 16 DAE visual meshes, so re-converting actually improves the materials.
  - name: piper_agilex
    vendor: AgileX
    repo: agilex_piper
    package: piper_description
    source: urdf/piper_description_v100.urdf
    # Every <visual> carries a flat URDF colour that would override the 13-15 materials
    # each of piper's DAE files actually defines.
    strip_visual_materials: true
    reach_m: 0.70
    visual_meshes: dae
