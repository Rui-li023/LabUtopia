    source_file: scripts/urdf_to_usd/xacro_overlays/abb_gofa_robotiq85.xacro
    extra_repos: [arx_common]
    preview_pose: [0.0, -0.65, -0.6, 0.0, 1.15, 0.0]
    reach_m: 1.08
