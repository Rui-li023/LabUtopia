  - name: fanuc_crx10ia_robotiq85
    vendor: FANUC + Robotiq
    repo: fanuc
    package: fanuc_crx10ia_support
    source_file: scripts/urdf_to_usd/xacro_overlays/fanuc_crx10ia_robotiq85.xacro
