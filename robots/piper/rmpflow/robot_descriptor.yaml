# Robot descriptor for Agilex Piper
# Defines the generalized coordinates and mapping to URDF

api_version: 1.0

# Generalized coordinates (6 DOF arm joints only, gripper joints are fixed)
cspace:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6

root_link: base_link

# Default joint configuration (home position for 6 arm joints)
default_q: [
    0.00,    # joint1
    1.57,    # joint2 (90 degrees)
    -1.57,   # joint3 (-90 degrees)
    0.00,    # joint4
    0.00,    # joint5
    0.00     # joint6
]

# Joint limits from URDF
# joint1: [-2.618, 2.618]
# joint2: [0, 3.14]
# joint3: [-2.697, 0]
# joint4: [-1.832, 1.832]
# joint5: [-1.22, 1.22]
# joint6: [-2.0944, 2.0944]

acceleration_limits: [15.0, 10.0, 10.0, 12.5, 15.0, 20.0]
jerk_limits: [7500.0, 5000.0, 5000.0, 6250.0, 7500.0, 10000.0]

# Gripper joints are fixed during motion planning (not in cspace)
cspace_to_urdf_rules:
    - {name: joint7, rule: fixed, value: 0.035}
    - {name: joint8, rule: fixed, value: -0.035}

# Collision spheres for self-collision avoidance
collision_spheres:
    - base_link:
        - "center": [0.0, 0.0, 0.06]
          "radius": 0.05
    - link1:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.04
    - link2:
        - "center": [0.1, 0.0, 0.0]
          "radius": 0.04
        - "center": [0.2, 0.0, 0.0]
          "radius": 0.04
        - "center": [0.28, 0.0, 0.0]
          "radius": 0.04
    - link3:
        - "center": [0.0, -0.1, 0.0]
          "radius": 0.04
        - "center": [0.0, -0.2, 0.0]
          "radius": 0.04
    - link4:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.035
    - link5:
        - "center": [0.0, -0.05, 0.0]
          "radius": 0.035
    - link6:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.03
    - link7:
        - "center": [0.0, 0.02, 0.0]
          "radius": 0.02
    - link8:
        - "center": [0.0, -0.02, 0.0]
          "radius": 0.02
