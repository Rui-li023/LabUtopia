# Level-1 pick with a Kinova Gen3 carrying a Robotiq 2F-85.
#
# The arm and gripper are imported from one combined USD articulation.  The first
# tuned configuration collects three successful episodes; promote max_episodes
# to 10 when establishing a longer benchmark.

name: level1_pick_gen3_robotiq

task_type: "pick"
controller_type: "pick"

mode: "collect"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
max_episodes: 3
seed: 7

task:
  max_steps: 2000
  obj_paths:
    - path: "/World/beaker2"
      # The stock beaker flares to 111 mm while the 2F-85 has an 85 mm stroke.
      # Gen3's required tilted wrist cannot clear that rim to reach the 69 mm base.
      scale: 0.75
      friction: 1.5
      position_range:
        x: [0.22, 0.24]
        y: [-0.055, -0.04]
        z: [0.84, 0.84]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [1.6, 0, 1.85]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.17, 0, 2.3]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

grasp:
  # grasp_frame is authored between the Robotiq pads with canonical +Y finger and
  # +Z approach axes, so no robot-side frame correction is needed.
  ee_euler_deg: [0, 120, 25]
  approach_along_tool: true
  require_pregrasp_xyz: true
  pregrasp_position_threshold: 0.02
  events_dt: [0.004, 0.002, 0.01, 0.02, 0.05, 0.002, 0.008]
  # With the shared 50 mm pre-grasp height, 87 mm of horizontal standoff makes
  # the final segment parallel to this pose's 30-degree-down tool axis.
  pre_offset_x: 0.087
  after_offset_z: 0.15
  lift_offset_xyz: [-0.05, 0.02, 0.13]
  # A full-close command drives the pads through the beaker and ejects it. This
  # target gives an inner gap of about 59 mm and maintains contact on the 69 mm base.
  gripper_distance: 0.035

robot:
  type: "gen3_robotiq"
  position: [-0.45, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

collect_position_only: true
action_randomization: false
