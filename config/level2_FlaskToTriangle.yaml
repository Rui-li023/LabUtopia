name: Level2_FlaskToTriangle

task_type: "flask_to_cork"
controller_type: "flask_to_cork"

mode: "collect"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/lab_002/lab_002.usd"
max_episodes: 50

# ── Replay mode ──────────────────────────────────────────────────────────────
replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

infer:
  type: "local"
  obs_names: {"image": 'camera_1_rgb', "image_2": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 2000
  obj_paths:
    # Source: round-bottom flask (starts on cork ring)
    - path: "/World/round_bottom_flask"
      position_range:
        x: [0.19, 0.34]
        y: [0.10, 0.25]
        z: [0.86, 0.86]

    # Target: pipeclay triangle to place the flask onto
    - path: "/World/pipeclay_triangle"
      position_range:
        x: [0.18, 0.30]
        y: [-0.33, -0.18]
        z: [0.77, 0.77]

    # Support: cork ring under the flask at start
    - path: "/World/cork_ring"
      position_range:
        x: [0.19, 0.34]
        y: [0.10, 0.25]
        z: [0.715, 0.715]

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [2, 0, 2]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [0.1, 0, 2.5]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "wrist_image"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
