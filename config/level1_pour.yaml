name: level1_pour

task_type: "pick_pour"
controller_type: "pour"

mode: "infer"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
target_path: "/World/beaker1"
max_episodes: 50

# ── Replay mode ─────────────────────────────────────────────────────────────
# Set mode: "replay" above to activate.
# dataset_path: root dataset directory that contains episode_XXXX sub-folders.
# episode_indices (optional): list of episode indices to replay; omit to replay all.
replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

infer:
  type: "remote"
  obs_names: {"image": 'observation/image', "image_2": 'observation/wrist_image', "wrist_image": 'observation/wrist_image_2'}
  prompt: "Pour the contents of the beaker into the target."
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 18084
  action_chunk_len: 40
  image_color: bgr
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  # Position-controlled pour (position_pour). L1 实测执行摆幅 72.3 deg；1.2 对 50 deg 成功门只剩 4.2 deg 余量，1.3 留 9.7 deg.
  position_pour: true
  pour_angle_rad: 1.3
  max_steps: 1500
  left_pos:
    x: [0.18, 0.33]
    y: [-0.32, -0.17]
    z: [0.87, 0.87]
  obj_paths:
    - path: "/World/beaker2"
      position_range:
        x: [0.22, 0.37]
        y: [0.0, 0.15]
        z: [0.87, 0.87]

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [2, -0.1, 2]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [0.1, -0.1, 3]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "wrist_image"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

# Position-only collection: same control law as replay/inference
# (RMPFlow virtual rollout + velocity strip + commanded gripper channel).
collect_position_only: true
