name: level1_open_door

task_type: "open_close"
controller_type: "open"

mode: "collect"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
max_episodes: 50

# ── Replay mode ─────────────────────────────────────────────────────────────
# Set mode: "replay" above to activate.
# dataset_path: root dataset directory that contains episode_XXXX sub-folders.
# episode_indices (optional): list of episode indices to replay; omit to replay all.
replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

infer:
  type: "local"
  obs_names: {"image": 'camera_1_rgb', "image_2": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 1000
  operate_type: "door"
  obj_paths:
    - path: "/World/DryingBox_01"
      position_range:
        x: [0.70, 0.80]
        y: [0.05, 0.15]
        z: [0.78, 0.78]

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [-0.7, 1.4, 1.4]
    resolution: [256, 256]
    focal_length: 2
    orientation: [-0.2297, -0.18336, 0.59631, 0.74701]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [-1, -0.1, 3.6]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.69035, 0.15304, -0.15304, -0.69035]
    image_type: "rgb"

  - prim_path: ${robot_camera_profiles.${robot.type}.arm_camera_prim_path}
    name: "wrist_image"
    translation: ${robot_camera_profiles.${robot.type}.arm_camera_translation}
    orientation: ${robot_camera_profiles.${robot.type}.arm_camera_orientation}
    focal_length: ${robot_camera_profiles.${robot.type}.arm_camera_focal_length}
    resolution: ${robot_camera_profiles.${robot.type}.arm_camera_resolution}
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

# Per-robot overrides for camera/robot-specific parameters.
# Add a new robot key here and switch `robot.type` above to reuse this task config.
robot_camera_profiles:
  franka:
    arm_camera_prim_path: "/World/Franka/panda_hand/arm_camera"
    arm_camera_translation: [-0.2, 0.0, -0.02]
    arm_camera_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    arm_camera_focal_length: 1.0
    arm_camera_resolution: [256, 256]
  piper:
    arm_camera_prim_path: "/World/Piper/gripper_base/arm_camera"
    arm_camera_translation: [-0.5, 0.0, -0.1]
    arm_camera_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    arm_camera_focal_length: 1.0
    arm_camera_resolution: [256, 256]
  ridgebase:
    arm_camera_prim_path: "/World/Ridgebase/panda_hand/arm_camera"
    arm_camera_translation: [-0.2, 0.0, -0.02]
    arm_camera_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    arm_camera_focal_length: 1.0
    arm_camera_resolution: [256, 256]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
