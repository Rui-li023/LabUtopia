name: Level3_pick

task_type: "pick"
controller_type: "pick"

mode: "collect"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
max_episodes: 100

# ── Replay mode ─────────────────────────────────────────────────────────────
# Set mode: "replay" above to activate.
# dataset_path: root dataset directory that contains episode_XXXX sub-folders. For example: "./outputs/collect/2026.02.26/09.56.41_Level3_pick/dataset"
# episode_indices (optional): list of episode indices to replay; omit to replay all.
replay:
  dataset_path: "outputs/collect/2026.02.28/00.15.51_Level3_pick/dataset"
  # episode_indices: [0, 1, 2]

infer:
  type: "remote" # "local", "remote"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_2_rgb": 'camera_2_rgb', "camera_3_rgb": 'camera_3_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

  is_test_material: False

task:
  max_steps: 1000
  obj_paths:
    - path: "/World/conical_bottle02"
      position_range:
        x: [0.21, 0.36]
        y: [-0.08, 0.08]
        z: [0.82, 0.82]
    - path: "/World/conical_bottle03"
      position_range:
        x: [0.21, 0.36]
        y: [-0.08, 0.08]
        z: [0.82, 0.82]
    - path: "/World/conical_bottle04"
      position_range:
        x: [0.21, 0.36]
        y: [-0.08, 0.08]
        z: [0.82, 0.82]
  material_paths:
    - path: /World/table/surface
      materials:
        - "/World/Looks/Material1_plastic_dark_blue"
        - "/World/Looks/Material2_wood"
        - "/World/Looks/Material3_plastic_dark_green"
        - "/World/Looks/Material4_plastic_light_white"
        - "/World/Looks/Material5_black"
      test_materials:
        - "/World/Looks/Material6_plastic_light_blue"
        - "/World/Looks/Material7_stainless"

lighting:
  enabled: true
  scenario: "standard_lab"
  num_lights: 3
  intensity_range: [500, 4000]
  exposure_range: [-2, 5]
  color_temp_range: [4000, 9000]
  randomize_position: false
  position_range:
    x: [-1.0, 1.0]
    y: [-1.0, 1.0]
    z: [1.5, 3.0]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [1.6, 0, 1.85]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.17, 0, 2.3]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: ${robot_camera_profiles.${robot.type}.arm_camera_prim_path}
    name: "camera_3"
    translation: ${robot_camera_profiles.${robot.type}.arm_camera_translation}
    orientation: ${robot_camera_profiles.${robot.type}.arm_camera_orientation}
    focal_length: ${robot_camera_profiles.${robot.type}.arm_camera_focal_length}
    resolution: ${robot_camera_profiles.${robot.type}.arm_camera_resolution}
    image_type: "rgb"

# Per-robot wrist camera overrides.
robot_camera_profiles:
  franka:
    arm_camera_prim_path: "/World/Franka/panda_hand/arm_camera"
    arm_camera_translation: [-0.2, 0.0, -0.02]
    arm_camera_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    arm_camera_focal_length: 1.0
    arm_camera_resolution: [256, 256]
  piper:
    arm_camera_prim_path: "/World/Piper/gripper_base/arm_camera"
    arm_camera_translation: [-0.5, 0.0, -0.1]
    arm_camera_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    arm_camera_focal_length: 1.0
    arm_camera_resolution: [256, 256]
  ridgebase:
    arm_camera_prim_path: "/World/Ridgebase/panda_hand/arm_camera"
    arm_camera_translation: [-0.2, 0.0, -0.02]
    arm_camera_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    arm_camera_focal_length: 1.0
    arm_camera_resolution: [256, 256]

robot:
  type: "piper"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
