name: level4_clean_beaker

task_type: "clean_beaker"
controller_type: "clean_beaker"

mode: "collect"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/hard_task/Scene1_hard.usd"
target_beaker: "/World/target_plat"
beaker_1: "/World/beaker_hard_1"
beaker_2: "/World/beaker_hard_2"
plat_1: "/World/target_plat_1"
plat_2: "/World/target_plat_2"

# ── Replay mode ─────────────────────────────────────────────────────────────
# Set mode: "replay" above to activate.
# dataset_path: root dataset directory that contains episode_XXXX sub-folders.
# episode_indices (optional): list of episode indices to replay; omit to replay all.
replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

task:
  material_paths:
    - paths:
        - "/World/table_hard/table_hard/table1/Group_2/table_surface/surface_1"
        - "/World/table_hard/table_hard/table1/Group_2/table_surface/surface_2"
        - "/World/table_hard/table_hard/table2/Group_2/table_surface/surface_1"
        - "/World/table_hard/table_hard/table2/Group_2/table_surface/surface_2"
      materials:
        - /World/Looks/Material_1_plastic_dark_blue
        - /World/Looks/table_material5
        - /World/Looks/Material_3_plastic_dark_green
        - /World/Looks/Material_4_plastic_light_white
        - /World/Looks/Material_5_black
      test_materials:
        - /World/Looks/Material_6_plastic_light_blue
        - /World/Looks/Material_7_stainless

infer:
  type: "local"
  obs_names: {"image": 'camera_1_rgb', "image_2": 'camera_2_rgb'}
  policy_model_path: "outputs/train/2025.08.05/21.20.28_train_act_image_Level4_CleanBeaker/checkpoints/last.ckpt"
  policy_config_path: "outputs/train/2025.08.05/21.20.28_train_act_image_Level4_CleanBeaker/.hydra/config.yaml"
  normalizer_path: "outputs/train/2025.08.05/21.20.28_train_act_image_Level4_CleanBeaker/checkpoints/normalize.ckpt"
  host: ""
  port: 10023
  n_obs_steps: 3
  timeout: 30
  max_retries: 3
  is_test_material: False

max_episodes: 50

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [2, 0, 2]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [0.1, 0, 2.5]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "wrist_image"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
# Position-only collection: same control law as replay/inference
# (RMPFlow virtual rollout + velocity strip + commanded gripper channel).
collect_position_only: true

# Long-horizon: noise compounds across chained atomic actions — keep actions deterministic
action_randomization: false
