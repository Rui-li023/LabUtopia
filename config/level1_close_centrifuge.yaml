name: level1_close_centrifuge

task_type: "open_close"
controller_type: "close"

mode: "infer"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/lab_002/lab_002.usd"
max_episodes: 50

# ── Replay mode ─────────────────────────────────────────────────────────────
replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

infer:
  type: "remote"
  obs_names: {"image": 'observation/image', "image_2": 'observation/wrist_image', "wrist_image": 'observation/wrist_image_2'}
  prompt: "Close the lid of the centrifuge eppendorf."
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 18084
  action_chunk_len: 40
  image_color: bgr
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 1200
  operate_type: "lid"
  handle_path: "/World/centrifuge_eppendorf_5430/thermal_mixer/door"
  obj_paths:
    - path: "/World/centrifuge_eppendorf_5430"
      position_range:
        x: [0.25, 0.35]
        y: [-0.05, 0]
        z: [0.73, 0.73]

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [-0.7, 1.4, 1.4]
    resolution: [256, 256]
    focal_length: 2
    orientation: [-0.2297, -0.18336, 0.59631, 0.74701]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [-1, -0.1, 3.6]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.69035, 0.15304, -0.15304, -0.69035]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "wrist_image"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

# Position-only collection: same control law as replay/inference
# (RMPFlow virtual rollout + velocity strip + commanded gripper channel).
collect_position_only: true
