name: level2_transport_beaker_v2

# level2/transport_beaker 的泛化增强采集（500 集）。同一套配方，见
# config/level1_pick_v2.yaml 的头注释；这里只记与本任务有关的差别。
#
# 本任务是两段的（PICKING 抓 beaker2 → PLACING 放到 target_plat），
# **两段的手腕姿态原本都是硬编码**（[0,90,30] / [0,90,20]），
# 谁都不跟着自己那一段的目标走。现在两段各有一个 GraspFrame：
# 抓的时候跟 beaker2 的方位角，放的时候跟 target_plat 的方位角。
# 这也是两个范围能同时放大的前提。

task_type: "place"
controller_type: "pick_place"

mode: "collect"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
target_path: "/World/target_plat"
max_episodes: 500
collect_position_only: true

grasp:
  ee_euler_deg: [0, 90, 30]        # PICKING 段的历史值，当 nominal
  place_ee_euler_deg: [0, 90, 20]  # PLACING 段的历史值，当 nominal
  # ★ 抓取高度 +0.5 cm。beaker2 在共享表里的默认是 0.0（抓杯身中心），
  # 所以这里就是 0.005。
  pick_z_offset: 0.005
  yaw_jitter_deg: 8.0
  tilt_jitter_deg: 4.0
  bearing_gain: 1.0

task:
  max_steps: 2000
  obj_paths:
    # 底座在 (-0.40, 0.00, 0.71)，yaw 0。放大同样以横向为主，最远端的平面半径
    # 不超过原来的水平（依据见 level1_pick_v2.yaml 的范围注释）。
    - path: "/World/beaker2"
      # 旧: x [0.19, 0.34] y [0.10, 0.25] = 15 x 15 cm，r 0.60~0.78
      # 新: x [0.14, 0.32] y [0.04, 0.28] = 18 x 24 cm，r 0.54~0.77
      position_range:
        x: [0.14, 0.32]
        y: [0.04, 0.28]
        z: [0.84, 0.84]

    - path: "/World/target_plat"
      # 旧: x [0.18, 0.30] y [-0.33, -0.18] = 12 x 15 cm，r 0.60~0.79
      # 新: x [0.12, 0.30] y [-0.38, -0.16] = 18 x 22 cm，r 0.54~0.80
      # 与 beaker2 的 y 至少隔开 0.20 m（0.04 vs -0.16），不会摆重叠。
      position_range:
        x: [0.12, 0.30]
        y: [-0.38, -0.16]
        z: [0.776, 0.776]

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [2, 0, 2]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [0.1, 0, 2.5]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "wrist_image"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

lighting:
  enabled: true
  # 场景里只有 **1 盏灯**（运行日志 "Randomized 1 scene lights"）。强度、曝光、
  # 色温三个量全压在它一个身上，没有别的灯兜底，所以这里不随机**绝对强度** ——
  # 只用 exposure 这个 2 的幂次**乘数**摆动，中位数曝光 = 0 = 场景原始光照，
  # 也就是现有 L1-L4 数据集一直在用的那个工作点。
  randomize_intensity: false
  exposure_range: [-0.7, 0.7]      # 0.62x ~ 1.62x
  # 色温收窄到 4500-7500K（中心 6000K）。第一版给到 3500-9000K，实测暗端画面
  # 亮度 YAVG=41（瓶子看不出轮廓）、亮端整场景发蓝 —— 一部分是随机器把色偏叠加
  # 了两次（已修，见 utils/lighting_utils.py），另一部分就是区间本身太宽。
  color_temp_range: [4500, 7500]
  # 灯**位置**不随机化：挪灯会改变桌面明暗梯度和阴影方向，那是「换了个场景」，
  # 不是「同一场景的光照变化」。要放开应该单独做一版对照。
  randomize_position: false
collector:
  type: "default"
  compression: gzip

replay:
  dataset_path: ""

infer:
  type: "remote"
  obs_names: {"image": 'observation/image', "image_2": 'observation/wrist_image', "wrist_image": 'observation/wrist_image_2'}
  host: "127.0.0.1"
  port: 18081
  action_chunk_len: 10
  image_color: bgr
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
