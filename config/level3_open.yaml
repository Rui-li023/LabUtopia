name: level3_open

task_type: "open_close"
controller_type: "open"

mode: "collect"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
max_episodes: 100

# ── Replay mode ─────────────────────────────────────────────────────────────
# Set mode: "replay" above to activate.
# dataset_path: root dataset directory that contains episode_XXXX sub-folders.
# episode_indices (optional): list of episode indices to replay; omit to replay all.
replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

infer:
  type: "replay"  # "local", "remote", or "replay"
  replay_data_path: "/home/ubuntu/Documents/LabUtopia/outputs/collect/2026.02.08/22.08.04_Level3_open/dataset/episode_0001.h5"
  episode_index: 0 # replay mode only
  obs_names: {"image": 'camera_1_rgb', "image_2": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

  is_test_material: False

task:
  max_steps: 1000
  placement:
    support_surface_path: "/World/table/surface"
    collision_margin_xy: 0.03
    max_sample_attempts: 50
  operate_type: "door" # "door" or "drawer"
  obj_paths:
    - path: "/World/DryingBox_01"
      position_range:
        x: [0.72, 0.77]
        y: [0.0, 0.15]
        z: [0.78, 0.78]
      close_gripper_distance: 0.015
    - path: "/World/DryingBox_02"
      position_range:
        x: [0.72, 0.77]
        y: [-0.05, 0.010]
        z: [0.78, 0.78]
      close_gripper_distance: 0.02
    - path: "/World/MuffleFurnace"
      position_range:
        x: [0.65, 0.70]
        y: [-0.05, 0.010]
        z: [0.78, 0.78]
      close_gripper_distance: 0.02
  distractors:
    enabled: true
    candidates:
      - "/World/beaker1"
      - "/World/beaker2"
      - "/World/beaker3"
      - "/World/conical_bottle02"
      - "/World/conical_bottle03"
      - "/World/glass_rod"
      - "/World/graduated_cylinder_03"
    num_range: [3, 5]
    placement_zones:
      - { x: [0.45, 0.65], y: [-0.25, 0.25], z: [0.82, 0.82] }
      - { x: [-0.10, 0.10], y: [-0.25, 0.25], z: [0.82, 0.82] }
      - { x: [0.05, 0.55], y: [0.18, 0.35], z: [0.82, 0.82] }
      - { x: [0.05, 0.55], y: [-0.35, -0.18], z: [0.82, 0.82] }
  material_paths:
    - path: "/World/table/surface"
      materials:
        - "/World/Looks/Material1_plastic_dark_blue"
        - "/World/Looks/Material2_wood"
        - "/World/Looks/Material3_plastic_dark_green"
        - "/World/Looks/Material4_plastic_light_white"
        - "/World/Looks/Material5_black"
      test_materials:
        - "/World/Looks/Material6_plastic_light_blue"
        - "/World/Looks/Material7_stainless"

lighting:
  enabled: true
  scenario: "standard_lab"
  num_lights: 3
  intensity_range: [500, 5000]
  exposure_range: [-2, 4]
  color_temp_range: [4000, 9000]
  randomize_position: false
  position_range:
    x: [-1.0, 1.0]
    y: [-1.0, 1.0]
    z: [1.5, 3.0]

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [-0.7, 1.4, 1.4]
    resolution: [256, 256]
    focal_length: 2
    orientation: [-0.2297, -0.18336, 0.59631, 0.74701]
    image_type: "rgb"
    randomize:
      translation_range:
        x: [-0.05, 0.05]
        y: [-0.05, 0.05]
        z: [-0.05, 0.05]
      orientation_noise: 0.02
      focal_length_range: [-0.5, 0.5]

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [-1, -0.1, 3.6]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.69035, 0.15304, -0.15304, -0.69035]
    image_type: "rgb"
    randomize:
      translation_range:
        x: [-0.05, 0.05]
        y: [-0.05, 0.05]
        z: [-0.05, 0.05]
      orientation_noise: 0.02
      focal_length_range: [-0.5, 0.5]

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "wrist_image"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

# Position-only collection: same control law as replay/inference
# (RMPFlow virtual rollout + velocity strip + commanded gripper channel).
collect_position_only: true
