name: level2_flask_to_triangle
task_type: flask_to_cork
controller_type: flask_to_cork
mode: collect
# Original geometry, corrected support colliders, cork-looking stopper/support.
usd_path: assets/chemistry_lab/lab_002/flask_support_collision/lab_002_flask_cork.usda
max_episodes: 50
replay:
  dataset_path: ''
infer:
  type: local
  obs_names:
    image: camera_1_rgb
    image_2: camera_2_rgb
  policy_model_path: ''
  policy_config_path: ''
  normalizer_path: ''
  host: 127.0.0.1
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3
task:
  # Record the same pre-warmup physical state, including native support poses.
  record_replay_physics_snapshot: true
  max_steps: 2000
  obj_paths:
  - path: /World/round_bottom_flask
    position_range:
      x:
      - 0.19
      - 0.34
      'y':
      - 0.1
      - 0.25
      z:
      - 0.86
      - 0.86
  - path: /World/pipeclay_triangle
    position_range:
      x:
      - 0.18
      - 0.3
      'y':
      - -0.33
      - -0.18
      z:
      # Original stand feet on the original bench, not floating above it.
      - 0.761998924
      - 0.761998924
  - path: /World/cork_ring
    position_range:
      x:
      - 0.19
      - 0.34
      'y':
      - 0.1
      - 0.25
      z:
      # Original cork mesh bottom on the bench; FlaskSeat sets source height.
      - 0.734177190
      - 0.734177190
  attach_grasp: false
  # Original straight neck is 31-33 mm wide; total target jaw gap is 28 mm.
  gripper_distance: 0.014
  original_flask_neck_grasp: true
  placement_xy_tolerance: 0.015
  placement_z_tolerance: 0.012
  placement_tilt_tolerance_deg: 25.0
cameras:
- prim_path: /World/Camera1
  name: image
  translation:
  - 2
  - 0
  - 2
  resolution:
  - 256
  - 256
  focal_length: 5
  orientation:
  - 0.61237
  - 0.35355
  - 0.35355
  - 0.61237
  image_type: rgb
- prim_path: /World/Camera2
  name: image_2
  translation:
  - 0.1
  - 0
  - 2.5
  resolution:
  - 256
  - 256
  focal_length: 5
  orientation:
  - 0.70711
  - 0
  - 0
  - -0.70711
  image_type: rgb
- prim_path: /World/Franka/panda_hand/arm_camera
  name: wrist_image
  resolution:
  - 256
  - 256
  image_type: rgb
robot:
  type: franka
  position:
  - -0.4
  - 0
  - 0.71
collector:
  type: default
  compression: gzip
  # Keep float32 policy actions plus a lossless normalized-command replay stream.
  record_precise_replay_actions: true
hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

# Position-only collection: same control law as replay/inference
# (RMPFlow virtual rollout + velocity strip + commanded gripper channel).
collect_position_only: true
