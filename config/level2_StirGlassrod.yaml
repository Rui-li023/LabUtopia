name: Level2_StirGlassrod

task_type: "stir"
controller_type: "stirglassrod"

mode: "collect"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/lab_003/lab_003.usd"
obj_path: "/World/glass_rod"
sub_obj_path: "/World/glass_rod/Cylinder"
target_path: "/World/target_beaker"
max_episodes: 50

# ── Replay mode ─────────────────────────────────────────────────────────────
# Set mode: "replay" above to activate.
# dataset_path: root dataset directory that contains episode_XXXX sub-folders.
# episode_indices (optional): list of episode indices to replay; omit to replay all.
replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

infer:
  type: "local"
  obs_names: {"image": 'camera_1_rgb', "image_2": 'camera_2_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [2, 0, 2]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [0.1, 0, 2.5]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
