name: level1_press

task_type: "press"
controller_type: "press"

mode: "infer"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/lab_003/lab_003.usd"
instrument_path: "/World/instrument"
target_button_path: "/World/instrument/target_button"
distractor_button1_path: "/World/instrument/distractor_button_1"
distractor_button2_path: "/World/instrument/distractor_button_2"
# Prismatic joints that constrain each button. Order MUST match the three
# button paths above (target, distractor1, distractor2).
button_joint_paths:
  - "/World/instrument/PrismaticJoint_00"
  - "/World/instrument/PrismaticJoint_01"
  - "/World/instrument/PrismaticJoint_02"
# instrument xform is scaled 0.001 (mm authoring), so world-space Y offsets
# applied to joint localPos must be divided by this scale.
button_joint_localpos_scale: 0.001
max_episodes: 50

# ── Replay mode ─────────────────────────────────────────────────────────────
# Set mode: "replay" above to activate.
# dataset_path: root dataset directory that contains episode_XXXX sub-folders.
# episode_indices (optional): list of episode indices to replay; omit to replay all.
replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

task:
  max_steps: 1500
  material_paths:
    - path: /World/instrument/target_button/button
      materials:
        - /World/Looks/OmniPBR_Button_Red
      test_materials:
        - /World/Looks/OmniPBR_Button_Blue
        - /World/Looks/OmniPBR_Button_DeepGray
        - /World/Looks/OmniPBR_Button_Yellow
        - /World/Looks/OmniPBR_Button_Gray
        - /World/Looks/OmniPBR_Button_Green
      random: true

infer:
  type: "remote"
  obs_names: {"image": 'observation/image', "image_2": 'observation/wrist_image', "wrist_image": 'observation/wrist_image_2'}
  prompt: "Press the button."
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 18084
  action_chunk_len: 40
  image_color: bgr
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [-0.28673, -3.51678, 1.46281]
    resolution: [256, 256]
    focal_length: 6
    orientation: [0.72889, 0.68336, -0.02857, -0.03028]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [0.1, -0.08, 3.01252]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "wrist_image"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

# Position-only collection: same control law as replay/inference
# (RMPFlow virtual rollout + velocity strip + commanded gripper channel).
collect_position_only: true
