name: level2_stopper_to_flask
task_type: stopper_flask
controller_type: stopper_flask
mode: collect
# Original glass visuals, Blender-calibrated cork and an actually open neck collider.
usd_path: assets/chemistry_lab/lab_002/stopper_insertion/lab_002_stopper_insertion.usda
max_episodes: 50
replay:
  dataset_path: ''
infer:
  type: local
  obs_names:
    image: camera_1_rgb
    image_2: camera_2_rgb
  policy_model_path: ''
  policy_config_path: ''
  normalizer_path: ''
  host: 127.0.0.1
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3
task:
  physical_insertion: true
  record_replay_physics_snapshot: true
  max_steps: 2000
  gripper_distance: 0.016
  insertion_depth: 0.0132
  minimum_insertion_depth: 0.010
  maximum_insertion_depth: 0.018
  placement_xy_tolerance: 0.0025
  placement_z_tolerance: 0.002
  placement_tilt_tolerance_deg: 8.0
  obj_paths:
  - path: /World/rubber_stopper
    position_range:
      x:
      - 0.19
      - 0.34
      'y':
      - 0.1
      - 0.25
      z:
      - 0.736
      - 0.736
  - path: /World/round_bottom_flask_01
    position_range:
      x:
      - 0.18
      - 0.3
      'y':
      - -0.33
      - -0.18
      z:
      # Reset sets the bottle height from the original cork ring's OpenFlaskSeat.
      - 0.736
      - 0.736
  - path: /World/cork_ring
    position_range:
      x: [0.18, 0.30]
      y: [-0.33, -0.18]
      z: [0.734177190, 0.734177190]
cameras:
- prim_path: /World/Camera1
  name: image
  translation:
  - 2
  - 0
  - 2
  resolution:
  - 256
  - 256
  focal_length: 5
  orientation:
  - 0.61237
  - 0.35355
  - 0.35355
  - 0.61237
  image_type: rgb
- prim_path: /World/Camera2
  name: image_2
  translation:
  - 0.1
  - 0
  - 2.5
  resolution:
  - 256
  - 256
  focal_length: 5
  orientation:
  - 0.70711
  - 0
  - 0
  - -0.70711
  image_type: rgb
- prim_path: /World/Franka/panda_hand/arm_camera
  name: wrist_image
  resolution:
  - 256
  - 256
  image_type: rgb
robot:
  type: franka
  position:
  - -0.4
  - 0
  - 0.71
  gripper:
    control_mode: position
    closing_speed: 0.15
    closing_force: 30.0
collector:
  record_precise_replay_actions: true
  type: default
  compression: gzip
hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

# Position-only collection: same control law as replay/inference
# (RMPFlow virtual rollout + velocity strip + commanded gripper channel).
collect_position_only: true
