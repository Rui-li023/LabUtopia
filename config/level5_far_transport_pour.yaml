name: level5_far_transport_pour

task_type: "mobile_transport_pour"
controller_type: "mobile_transport_pour"

mode: "collect"  # "collect", "infer", or "replay"
usd_path: "assets/navigation_lab/navigation_lab_01/lab.usd"
max_episodes: 100
collect_position_only: true

replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

infer:
  type: "local"
  obs_names: {"image": 'front_camera_rgb', "image_2": 'top_camera_rgb', "wrist_image": 'wrist_camera_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 6000
  navigation_config_path: "config/navigation/navigation_assets.yaml"
  pick_object_path: "/World/beaker"
  object_position_range:
    # tuned: mirrors level5_close_pick_pour (the far variant docks in front of
    # the pour target for the pour, so only the pick shares this range).
    x: [-2.90, -2.70]
    y: [0.62, 0.68]
    z: [0.80, 0.80]
  dock_standoff: 0.75            # tuned: 0.85 left the arm at its reach limit
                                 # (~0.018 m grasp undershoot → beaker shoved out)
  spawn:
    mode: "far"
    min_path_length: 4.0
  # tuned: mirrors level5_close_pick_pour — a top-down grasp [0,180,0] puts
  # the beaker axis on wrist joint 7, so the pour ramp can only yaw-spin it
  # (no real tilt, gate's return never satisfied). The [0,90,30] side grasp
  # (horizontal finger line) matches the proven L2 pick_pour pour family.
  grasp_ee_euler_deg: [0, 90, 30]
  pour_ee_euler_deg: [0, 90, 15]
  # tuned grip strategy: mirrors level5_close_pick_pour — pick at the table
  # default 0.022; tighter grips and the pour-entry re-squeeze all regressed
  # (see the close yaml for the measured comparison). pour_regrip_distance
  # stays available in the controller but is intentionally NOT set.
  pour_target:
    prim_path: "/World/target_beaker"
    usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
    source_prim_path: "/World/beaker1"
    position_range:
      x: [4.3, 5.3]
      y: [0.60, 0.72]
      z: [0.79, 0.79]
    carry_navigation: true
  max_linear_speed: 0.04
  max_angular_speed: 1.5
  position_threshold: 0.08
  angle_threshold: 0.1

cameras:
  - prim_path: "/World/Ridgebase/base_link/Camera"
    name: "front_camera"
    resolution: [256, 256]
    image_type: "rgb"

  - prim_path: "/World/Ridgebase/panda_hand/Camera"
    name: "wrist_camera"
    resolution: [256, 256]
    clipping_range: [0, 10.0]
    image_type: "rgb"

  - prim_path: "/World/Ridgebase/base_link/Camera_01"
    name: "top_camera"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "ridgebase"
  position: [0.0, 0.0, 0.0]

collector:
  type: "mobile"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
