# Level-1 physical pick with a UFACTORY xArm6 and Robotiq 2F-85.

name: level1_pick_xarm6_robotiq

task_type: "pick"
controller_type: "pick"

mode: "collect"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
max_episodes: 10
seed: 7

task:
  max_steps: 2000
  obj_paths:
    - path: "/World/beaker2"
      position_range:
        x: [0.20, 0.27]
        y: [-0.08, -0.04]
        z: [0.84, 0.84]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [1.6, 0, 1.85]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.17, 0, 2.3]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

grasp:
  # The 25-degree wrist yaw avoids the joint4 singularity at [0, 90, 0] while
  # keeping the open fingers level during the final approach.
  ee_euler_deg: [0, 90, 25]
  bearing_gain: 1.0
  approach_from_base: true
  require_pregrasp_xyz: true
  pregrasp_position_threshold: 0.005
  grasp_position_threshold: 0.005
  pick_z_offset: 0.045
  gripper_distance: 0.050

robot:
  type: "xarm6_robotiq"
  position: [-0.35, 0, 0.71]

collector:
  type: "mock"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

collect_position_only: true
action_randomization: false
