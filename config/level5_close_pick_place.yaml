name: level5_close_pick_place

task_type: "mobile_transport_place"
controller_type: "mobile_transport_place"

mode: "collect"  # "collect", "infer", or "replay"
usd_path: "assets/navigation_lab/navigation_lab_01/lab.usd"
max_episodes: 100
collect_position_only: true

replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

infer:
  type: "local"
  obs_names: {"image": 'front_camera_rgb', "image_2": 'top_camera_rgb', "wrist_image": 'wrist_camera_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 3000
  navigation_config_path: "config/navigation/navigation_assets.yaml"
  pick_object_path: "/World/beaker"
  object_position_range:
    x: [-3.15, -3.0]               # tuned (Task 11): midpoint dock puts the arm
    y: [0.58, 0.65]                # sep/2 laterally off the beaker; keep worst-case
    z: [0.80, 0.80]                # reach sqrt((sep/2)^2 + fwd^2) under ~0.50 m
  dock_standoff: 0.70            # tuned (Task 11): 0.75 + midpoint lateral offset
                                 # exceeded the top-down grasp envelope (pick 1/9)
  spawn:
    mode: "near"
    distance_range: [1.0, 2.0]
  grasp_ee_euler_deg: [0, 180, 0]  # tuned: top-down (fingers horizontal). The
                                   # default [-90,90,30] is a side grasp with a
                                   # vertical finger-line, which cannot straddle
                                   # a beaker standing on the bench.
  place_target:
    prim_path: "/World/target_plat"
    usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
    source_prim_path: "/World/target_plat"
    position_range:
      # Same-bench: the plat sits 0.3-1.1 m from the source beaker; the close
      # variant docks at the source/plat midpoint so both are Franka-reachable.
      x: [-2.7, -2.6]           # tuned (Task 11): source-plat separation 0.30-0.55 m
      y: [0.58, 0.65]           # matches source y so the plat stays in reach too
      z: [0.776, 0.776]         # tuned so the plat rests ON the 0.76 bench top
    carry_navigation: false
  max_linear_speed: 0.04
  max_angular_speed: 1.5
  position_threshold: 0.05        # tightened: exact dock endpoint appended to the A* path
  angle_threshold: 0.05          # tuned: 0.1 parked the base ~5.7 deg off square

cameras:
  - prim_path: "/World/Ridgebase/base_link/Camera"
    name: "top_camera"          # 3 m overhead view (prim was misnamed front_camera)
    resolution: [256, 256]
    image_type: "rgb"

  - prim_path: "/World/Ridgebase/panda_hand/Camera"
    name: "wrist_camera"
    resolution: [256, 256]
    clipping_range: [0, 10.0]
    image_type: "rgb"

  - prim_path: "/World/Ridgebase/base_link/Camera_01"
    name: "front_camera"        # over-shoulder forward view (prim was misnamed top_camera)
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "ridgebase"
  position: [0.0, 0.0, 0.0]

collector:
  type: "mobile"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
