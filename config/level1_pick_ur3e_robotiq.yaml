# Level-1 pick with a UR3e carrying a Robotiq 2F-85.
#
# The arm and gripper are imported from one combined URDF/USD articulation. The UR3e
# shares UR5e's joint names and tool-frame convention, so the same controller can drive
# both models while each keeps its own Lula/RMPFlow description.

name: level1_pick_ur3e_robotiq

task_type: "pick"
controller_type: "pick"

mode: "collect"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
max_episodes: 10

task:
  max_steps: 2000
  obj_paths:
    - path: "/World/beaker2"
      position_range:
        x: [0.15, 0.28]
        y: [-0.10, 0.10]
        z: [0.84, 0.84]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [1.6, 0, 1.85]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "camera_2"
    translation: [0.17, 0, 2.3]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

grasp:
  # UR3e uses the same canonical +Z approach frame as UR5e. The steeper approach
  # leaves the short arm room to descend behind the beaker and still lift vertically.
  ee_euler_deg: [0, 120, 25]

robot:
  type: "ur3e_robotiq"
  # The UR3e reaches about 0.50 m (versus 0.85 m for UR5e). Move its base
  # forward so the full object randomization range stays inside the workspace.
  position: [-0.25, 0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

collect_position_only: true
