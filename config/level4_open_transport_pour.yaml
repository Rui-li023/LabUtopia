name: level4_open_transport_pour

task_type: "open_transport_pour"
controller_type: "open_transport_pour"

mode: "collect"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
max_episodes: 50

# ── Replay mode ─────────────────────────────────────────────────────────────
# Set mode: "replay" above to activate.
# dataset_path: root dataset directory that contains episode_XXXX sub-folders.
# episode_indices (optional): list of episode indices to replay; omit to replay all.
replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

infer:
  type: "local"
  obs_names: {"image": 'camera_1_rgb', "image_2": 'camera_2_rgb'}
  policy_model_path: "outputs/train/2025.07.29/17.08.44_train_act_image_pick_act/checkpoints/latest.ckpt"
  policy_config_path: "outputs/train/2025.07.29/17.08.44_train_act_image_pick_act/.hydra/config.yaml"
  normalizer_path: "outputs/train/2025.07.29/17.08.44_train_act_image_pick_act/checkpoints/normalize.ckpt"
  host: "101.126.156.90"
  port: 10023
  n_obs_steps: 3
  timeout: 30
  max_retries: 3
  is_test_material: False

task:
  # Position-controlled pour, calibrated to about 107 deg of executed wrist motion.
  position_pour: true
  pour_angle_rad: 1.87
  max_steps: 6500
  # Realistic gripper<->glassware friction so the near-zero-squeeze grasp holds
  # the beaker/conical through transport+pour (and reproduces in open-loop replay)
  # without ejection. Applied to both grasped objects in collect AND replay.
  grasp_friction: 1.5
  gripper_drive_force: 60.0
  # Manufacturer travel speed PER finger; also constrain the passive mimic.
  gripper_max_joint_velocity: 0.05
  # Preserve the Panda's masses/COMs; recompute its anomalously tiny inertias
  # from the original colliders. Fresh collection is required for replay.
  robot_inertia_mode: collision_geometry
  conical_grasp:
    depth: 0.024
    closed_finger_position: 0.010
  gripper_contact:
    min_torsional_radius: 0.004
    stiffness: 60000.0
    damping: 100.0
    contact_offset: 0.0005
    static_friction: 0.9
    dynamic_friction: 0.7
  door_paths:
    - path: "/World/DryingBox_01"
      position_range:
        x: [0.72, 0.77]
        y: [0.0, 0.15]
        z: [0.78, 0.78]
    - path: "/World/MuffleFurnace"
      position_range:
        x: [0.65, 0.70]
        y: [-0.05, 0.010]
        z: [0.78, 0.78]

  obj_paths:
    - path: "/World/beaker2"
      position_range:
        x: [0.19, 0.34]
        y: [0.10, 0.25]
        z: [0.84, 0.84]
    - path: "/World/target_plat"
      position_range:
        x: [0.2, 0.3]
        y: [-0.3, -0.2]
        z: [0.776, 0.776]
  stir_tool_path: "/World/glass_rod"
  stir_tool_mesh_path: "/World/glass_rod/mesh"
  test_tube_rack_path: "/World/test_tube_rack"

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [-0.7, 1.4, 1.4]
    resolution: [256, 256]
    focal_length: 2
    orientation: [-0.2297, -0.18336, 0.59631, 0.74701]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [-1, -0.1, 3.6]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.69035, 0.15304, -0.15304, -0.69035]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "wrist_image"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip
  record_precise_replay_actions: true

liquid:
  enabled: true
  # Sixteen physics substeps per 60 Hz action; resolve neck/pad/mimic contacts.
  # Fresh collection is required after changing this value.
  physics_dt: 0.0010416666666666667
  particle_spacing: 0.004
  fill_height: 0.025
  isosurface: true
  min_target_fraction: 0.8
  max_source_fraction: 0.15
  max_outside_fraction: 0.05
  settle_steps: 60
  # Original flask is 16.45 cm tall; keep its base above the receiver before tilting.
  pour_lip_height: 0.12
  pour_upright_clearance: 0.08
  # Empty flask: retreat towards the robot, clear of the receiver, before uprighting.
  pour_return_lift: 0.04
  pour_return_retreat: 0.12
  pour_empty_threshold: 0.01
  pour_max_angle_deg: 120
  pour_drain_steps: 600
  pour_min_drain_steps: 240
  pour_approach_timeout: 600
  max_grasp_separation_change: 0.04
  max_target_tilt_deg: 20.0
  axisymmetric_source: true
  fixed_grasp_orientation: true
  pour_approach_tolerance: 0.012

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
# Position-only collection: same control law as replay/inference
# (RMPFlow virtual rollout + velocity strip + commanded gripper channel).
collect_position_only: true

# Long-horizon: noise compounds across chained atomic actions — keep actions deterministic
action_randomization: false
