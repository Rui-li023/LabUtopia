name: sim2real_pick_v2_pilot

# sim2real/pick 第二轮采集。相对 v1（500 集，config/sim2real_pick.yaml）改四处，
# 全部来自真机联调暴露的对齐差距：
#
#   1. 抓取高度降低 2 cm  —— 真机那只杯子比仿真锥形瓶矮约 2 cm
#   2. x/y 范围显著放大   —— v1 只有 36 x 26 cm，真机摆放位置经常落在框外
#   3. 光照/色温泛化加强  —— 真机光照与仿真仍有可见差距
#   4. 抓取姿态随机化     —— v1 每集都是同一个精确姿态，教出"只有这一个姿态对"
#
# 2、4 需要新的 `pick_wide` 控制器：`pick` 用**固定世界系**抓取姿态，物体一旦
# 横向偏开，姿态与接近方向就打架（详见 controllers/pick_wide_controller.py）。

task_type: "pick"
controller_type: "pick_wide"     # 不是 "pick"：见上

mode: "collect"
usd_path: "assets/sim2real/table_cell.usd"
max_episodes: 25                # collect 统计的是**成功**集数
collect_position_only: true      # 与 replay/infer 同一套控制律

grasp:
  # v1 的 [0, 90, -65] 是「物体正前方」这一个方位角调出来的。pick_wide 把它当作
  # nominal，再按物体方位角绕世界 +Z 旋转，所以这个值本身不用改。
  ee_euler_deg: [0, 90, -65]
  approach_from_base: true
  # ★ 改动 1：抓取高度下移 2 cm（v1 是 0.040）。
  # 真机上那只杯子比仿真锥形瓶矮约 2 cm，抓取点相对桌面也就低 2 cm。
  pick_z_offset: 0.020
  # ★ 改动 4：每集抽一次抓取姿态抖动。v1 全部 500 集都是同一个精确姿态，
  # 策略会把「只有这一个姿态能抓」当成规律；真机物体姿态从来不精确。
  yaw_jitter_deg: 8.0
  tilt_jitter_deg: 4.0
  bearing_gain: 1.0              # 1.0 = 完全跟随方位角（纯径向接近）

task:
  max_steps: 800
  obj_paths:
    - path: "/World/conical_bottle02"
      # ★ 改动 1b：把瓶子在 z 上压扁，对齐真机那只更矮的杯子。
      # 实测锥形瓶包围盒 92.6 x 92.6 x 164.5 mm ⇒ 矮 2 cm 对应 z 缩放 0.878。
      # 这和 pick_z_offset 是**互补**的，不是重复：offset 决定夹爪在哪闭合，
      # 缩放改的是**轮廓**——而轮廓才是策略从图像里看到的主要信息。
      # 每集在 0.84–0.92 之间抽（约 ±1 cm 高度），既覆盖真机杯高的不确定度，
      # 也让策略别把某一个精确高度当成规律。
      # 注意：碰撞体不会重新烘焙（Isaac 用加载时的近似），所以只做这种小幅压扁。
      scale: [1.0, 1.0, 0.878]
      scale_range:
        z: [0.84, 0.92]
      # ★ 改动 2：范围放大。
      # v1: x [-0.18, 0.18]  y [-0.62, -0.42]  = 36 x 26 cm = 926 cm²
      # v2: x [-0.30, 0.30]  y [-0.68, -0.40]  = 60 x 28 cm = 1680 cm²（1.8 倍）
      #
      # 边界依据（底座在 (0.00, 0.05, 0.75)，yaw -90°，肩部包络约 0.855 m）：
      #   平面半径 0.46 ~ 0.79 m = 包络的 54 % ~ 92 %
      #     近边 y=-0.40 ⇒ r>=0.45，仍避开 v1 实测只有 9% 成功率的 r<0.42 那一档
      #     远边 y=-0.68 ⇒ r<=0.79，留约 8% 余量，不贴死包络
      #   |x| 放到 0.30：另一条手臂底座在 x=-0.80，最近处仍有 0.50 m，不会相撞
      #   y 上限 -0.40 距驱动臂自己的底板（y 从 +0.05 起）还有 0.45 m
      #
      # 横向能放这么开，靠的就是 pick_wide 的方位角跟随；用 `pick` 的固定姿态
      # 在 |x|=0.30 处腕部会折得很难看。
      position_range:
        x: [-0.30, 0.30]
        y: [-0.68, -0.40]
        z: [0.77, 0.77]          # 桌面 0.75 + 2 cm 落定余量

cameras:
  - prim_path: "/World/Cameras/third_view_orbbec335L"
    name: "image"
    resolution: [640, 480]
    clipping_range: [0.02, 100.0]
    image_type: "rgb"

  - prim_path: "/World/Cameras/second_third_realsense435i"
    name: "image_2"
    resolution: [640, 480]
    clipping_range: [0.02, 100.0]
    image_type: "rgb"

  - prim_path: "/World/Franka_left/panda_hand/left_wrist_orbbec335"
    name: "wrist_image"
    resolution: [640, 480]
    clipping_range: [0.02, 100.0]
    image_type: "rgb"

robot:
  type: "franka"
  prim_path: "/World/Franka_left"
  position: [0.0, 0.05, 0.75]

# ── ★ 改动 3：光照泛化加强 ──────────────────────────────────────────────────
# `scenario` 仍然不设：一旦设置，base_task 会走另一个分支并绕过 randomize_intensity。
lighting:
  enabled: true
  # 台面灯是照真机标定过的，强度跨 60 / 600 / 785000；写一个绝对区间会把它们压成
  # 同一个数、标定作废。exposure 是 2 的幂次**乘数**，摆动大而保住相对配比。
  randomize_intensity: false
  # v1 [-1.3, 1.3] = 0.41x ~ 2.46x  →  v2 [-2.0, 2.0] = 0.25x ~ 4.0x
  # 仍然对称，所以中位数曝光 = 0 = 标定光照，真机工作点落在分布**中心**而非边缘。
  exposure_range: [-2.0, 2.0]
  # v1 [4300, 8700] → v2 [3000, 10000]：覆盖暖白荧光到阴天日光。
  # 中心仍在 6500K 附近，也就是做颜色标定时的那个点。
  color_temp_range: [3000, 10000]
  # 灯**位置**仍然不随机化。桌面前后明暗梯度是照真机一点点调出来的
  # （docs/sim2real_bench.md §6），移动灯位会把那个梯度直接打散，
  # 得到的不是"更强泛化"而是"另一个场景"。要放开的话应该单独做一版对照。
  randomize_position: false

collector:
  type: "default"
  compression: gzip

replay:
  dataset_path: ""

infer:
  type: "remote"
  obs_names: {"image": 'observation/image', "image_2": 'observation/wrist_image', "wrist_image": 'observation/wrist_image_2'}
  host: "127.0.0.1"
  port: 19080
  action_chunk_len: 60
  image_color: bgr
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
