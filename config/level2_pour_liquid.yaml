name: level2_pour_liquid
task_type: pick_pour
controller_type: pick_pour
mode: collect
usd_path: assets/chemistry_lab/lab_001/lab_001.usd
target_path: /World/beaker1
max_episodes: 50
replay:
  dataset_path: ''
infer:
  type: local
  obs_names:
    image: camera_1_rgb
    image_2: camera_2_rgb
  policy_model_path: ''
  policy_config_path: ''
  normalizer_path: ''
  host: 127.0.0.1
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3
task:
  max_steps: 2500
  left_pos:
    x:
    - 0.17
    - 0.32
    'y':
    - -0.35
    - -0.2
    z:
    - 0.87
    - 0.87
  obj_paths:
  - path: /World/beaker2
    position_range:
      x:
      - 0.22
      - 0.37
      'y':
      - 0.07
      - 0.22
      z:
      - 0.9
      - 0.9
cameras:
- prim_path: /World/Camera1
  name: image
  translation:
  - 2
  - -0.1
  - 2
  resolution:
  - 256
  - 256
  focal_length: 5
  orientation:
  - 0.61237
  - 0.35355
  - 0.35355
  - 0.61237
  image_type: rgb
- prim_path: /World/Camera2
  name: image_2
  translation:
  - 0.1
  - -0.1
  - 3
  resolution:
  - 256
  - 256
  focal_length: 5
  orientation:
  - 0.70711
  - 0
  - 0
  - -0.70711
  image_type: rgb
- prim_path: /World/Franka/panda_hand/arm_camera
  name: wrist_image
  resolution:
  - 256
  - 256
  image_type: rgb
robot:
  type: franka
  position:
  - -0.4
  - 0
  - 0.71
collector:
  type: default
  compression: gzip
hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

# Position-only collection: same control law as replay/inference
# (RMPFlow virtual rollout + velocity strip + commanded gripper channel).
collect_position_only: true
