name: Level3_PourLiquid

task_type: "pickpour"
controller_type: "pickpour"

mode: "collect"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
target_path: "/World/beaker1"
max_episodes: 100

# ── Replay mode ─────────────────────────────────────────────────────────────
# Set mode: "replay" above to activate.
# dataset_path: root dataset directory that contains episode_XXXX sub-folders.
# episode_indices (optional): list of episode indices to replay; omit to replay all.
replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

infer:
  type: "remote"
  obs_names: {"image": 'camera_1_rgb', "image_2": 'camera_2_rgb', "wrist_image": 'camera_3_rgb'}
  policy_model_path: "outputs/train/2025.05.07/17.06.34_train_dp3_PourLiquid/checkpoints/epoch=0040-train_loss=0.001.ckpt"
  policy_config_path: "outputs/train/2025.05.07/17.06.34_train_dp3_PourLiquid/.hydra/config.yaml"
  normalizer_path: "outputs/train/2025.05.07/17.06.34_train_dp3_PourLiquid/checkpoints/normalize.ckpt"
  host: "101.126.156.90"
  port: 56434
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

  is_test_material: True

task:
  max_steps: 1500
  placement:
    support_surface_path: "/World/table/surface"
    collision_margin_xy: 0.03
    max_sample_attempts: 50
  left_pos:
    x: [0.2, 0.3]
    y: [-0.3, -0.2]
    z: [0.86, 0.86]
  obj_paths:
    # - path: "/World/graduated_cylinder_03"
    #   position_range:
    #     x: [0.25, 0.35]
    #     y: [0.0, 0.1]
    #     z: [0.81, 0.81]
    # - path: "/World/conical_bottle03"
    #   position_range:
    #     x: [0.25, 0.35]
    #     y: [0.0, 0.1]
    #     z: [0.81, 0.81]
    - path: "/World/beaker2"
      position_range:
        x: [0.25, 0.35]
        y: [0.0, 0.1]
        z: [0.84, 0.84]

  distractors:
    enabled: true
    candidates:
      - "/World/conical_bottle02"
      - "/World/conical_bottle03"
      - "/World/conical_bottle04"
      - "/World/glass_rod"
      - "/World/graduated_cylinder_03"
    num_range: [3, 5]
    placement_zones:
      - { x: [0.45, 0.65], y: [-0.25, 0.25], z: [0.82, 0.82] }
      - { x: [-0.10, 0.10], y: [-0.25, 0.25], z: [0.82, 0.82] }
      - { x: [0.05, 0.55], y: [0.18, 0.35], z: [0.82, 0.82] }
      - { x: [0.05, 0.55], y: [-0.35, -0.18], z: [0.82, 0.82] }
  material_paths:
    - path: /World/table/surface
      materials:
        - "/World/Looks/Material1_plastic_dark_blue"
        - "/World/Looks/Material2_wood"
        - "/World/Looks/Material3_plastic_dark_green"
        - "/World/Looks/Material5_black"
        - "/World/Looks/Material6_plastic_light_blue"
      test_materials:
        - "/World/Looks/Material4_plastic_light_white"
        - "/World/Looks/Material7_stainless"

lighting:
  enabled: true
  scenario: "standard_lab"
  num_lights: 3
  intensity_range: [500, 5000]
  exposure_range: [-2, 4]
  color_temp_range: [4000, 9000]
  randomize_position: false
  position_range:
    x: [-1.0, 1.0]
    y: [-1.0, 1.0]
    z: [1.5, 3.0]

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [2, -0.1, 2.12]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"
    randomize:
      translation_range:
        x: [-0.05, 0.05]
        y: [-0.05, 0.05]
        z: [-0.05, 0.05]
      orientation_noise: 0.02
      focal_length_range: [-0.5, 0.5]

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [0.1, -0.1, 3]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"
    randomize:
      translation_range:
        x: [-0.05, 0.05]
        y: [-0.05, 0.05]
        z: [-0.05, 0.05]
      orientation_noise: 0.02
      focal_length_range: [-0.5, 0.5]

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "wrist_image"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
