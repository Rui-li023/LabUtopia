name: level2_pour_liquid_v2

# level2/pour_liquid 的泛化增强采集（500 集）。同一套配方，见
# config/level1_pick_v2.yaml 的头注释；这里只记与本任务有关的差别。
#
# 本任务两段（PICKING 抓 beaker2 → POURING 倒进 beaker1），**两段手腕姿态原本
# 都是硬编码**（[0,90,30] / [0,90,15]）。现在各自跟随自己那一段目标的方位角。
#
# ⚠️ 倒的那一段本来就是 L2 里最脆的一环（docs/level23_inference_report.md：
# 4 个 VLA 都抓得起来，没有一个能可靠复现「倒完回正」）。这一轮**只放宽摆放和
# 外观**，不动倒液本身的动力学参数（position_pour / pour_angle_rad 全部留默认）
# —— 一次只改一类变量，出了问题才分得清是谁。

task_type: pick_pour
controller_type: pick_pour

mode: collect
usd_path: assets/chemistry_lab/lab_001/lab_001.usd
target_path: /World/beaker1
max_episodes: 500
collect_position_only: true

grasp:
  ee_euler_deg: [0, 90, 30]       # PICKING 段的历史值，当 nominal
  pour_ee_euler_deg: [0, 90, 15]  # POURING 段的历史值，当 nominal
  # ★ 抓取高度 +0.5 cm。beaker2 在共享表里的默认是 0.0。
  pick_z_offset: 0.005
  # 下面三个不带前缀的值只作用在 PICKING 段。
  yaw_jitter_deg: 8.0
  tilt_jitter_deg: 4.0
  bearing_gain: 1.0
  # ★ POURING 段必须钉死在固定世界系姿态，不跟方位角、不抖动。
  # 成功门 `_check_phase_success` 判「回正」用的是
  # `check_rotation_angle(initial_quaternion, current_quat) < 30°` ——
  # 量的是**烧杯相对自己出生姿态**的全轴旋转量，跟手腕无关。接液杯 beaker1 的
  # 范围对应方位角 −14°~−38°，一跟随，整个倒液过程杯子就被握成偏转 14~46° 的
  # 姿态，「回正」回到的是那个**偏转过的**正 —— 30° 预算在倒之前就花光了。
  # 实测（20 集 pilot）：3/63 = 4.8%，118 条失败记录里 110 条是
  # "Return rotation not complete yet"。钉死后 PICKING 段照常跟随。
  pour_bearing_gain: 0.0
  pour_yaw_jitter_deg: 0.0
  pour_tilt_jitter_deg: 0.0

task:
  max_steps: 2500

  # 接液的 beaker1（底座在 (-0.40, 0.00, 0.71)，yaw 0）
  # 旧: x [0.17, 0.32] y [-0.35, -0.20] = 15 x 15 cm，r 0.61~0.80
  # 新: x [0.12, 0.30] y [-0.40, -0.18] = 18 x 22 cm，r 0.55~0.81
  left_pos:
    x: [0.12, 0.30]
    'y': [-0.40, -0.18]
    z: [0.87, 0.87]

  obj_paths:
    # 倒液源 beaker2
    # 旧: x [0.22, 0.37] y [0.07, 0.22] = 15 x 15 cm，r 0.62~0.80
    # 新: x [0.16, 0.34] y [0.02, 0.28] = 18 x 26 cm，r 0.56~0.79
    # 与 beaker1 的 y 至少隔开 0.20 m（0.02 vs -0.18）。
    - path: /World/beaker2
      position_range:
        x: [0.16, 0.34]
        'y': [0.02, 0.28]
        z: [0.90, 0.90]

cameras:
  - prim_path: /World/Camera1
    name: image
    translation: [2, -0.1, 2]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: rgb

  - prim_path: /World/Camera2
    name: image_2
    translation: [0.1, -0.1, 3]
    resolution: [256, 256]
    focal_length: 5
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: rgb

  - prim_path: /World/Franka/panda_hand/arm_camera
    name: wrist_image
    resolution: [256, 256]
    image_type: rgb

robot:
  type: franka
  position: [-0.4, 0, 0.71]

lighting:
  enabled: true
  # 场景里只有 **1 盏灯**（运行日志 "Randomized 1 scene lights"）。强度、曝光、
  # 色温三个量全压在它一个身上，没有别的灯兜底，所以这里不随机**绝对强度** ——
  # 只用 exposure 这个 2 的幂次**乘数**摆动，中位数曝光 = 0 = 场景原始光照，
  # 也就是现有 L1-L4 数据集一直在用的那个工作点。
  randomize_intensity: false
  exposure_range: [-0.7, 0.7]      # 0.62x ~ 1.62x
  # 色温收窄到 4500-7500K（中心 6000K）。第一版给到 3500-9000K，实测暗端画面
  # 亮度 YAVG=41（瓶子看不出轮廓）、亮端整场景发蓝 —— 一部分是随机器把色偏叠加
  # 了两次（已修，见 utils/lighting_utils.py），另一部分就是区间本身太宽。
  color_temp_range: [4500, 7500]
  # 灯**位置**不随机化：挪灯会改变桌面明暗梯度和阴影方向，那是「换了个场景」，
  # 不是「同一场景的光照变化」。要放开应该单独做一版对照。
  randomize_position: false
collector:
  type: default
  compression: gzip

replay:
  dataset_path: ''

infer:
  type: "remote"
  obs_names: {"image": 'observation/image', "image_2": 'observation/wrist_image', "wrist_image": 'observation/wrist_image_2'}
  host: "127.0.0.1"
  port: 18081
  action_chunk_len: 10
  image_color: bgr
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
