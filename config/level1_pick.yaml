name: Level1_pick

task_type: "pick"
controller_type: "pick"

mode: "infer"  # "collect", "infer", or "replay"
usd_path: "assets/chemistry_lab/lab_001/lab_001.usd"
max_episodes: 50

# ── Replay mode ─────────────────────────────────────────────────────────────
# Set mode: "replay" above to activate.
# dataset_path: root dataset directory that contains episode_XXXX sub-folders.
# episode_indices (optional): list of episode indices to replay; omit to replay all.
replay:
  dataset_path: ""
  # episode_indices: [0, 1, 2]

infer:
  type: "remote"
  obs_names: {"image": 'observation/image', "image_2": 'observation/wrist_image', "wrist_image": 'observation/wrist_image_2'}
  prompt: "Pick up the conical bottle from the table and lift it clear of the surface."
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 18081
  action_chunk_len: 50
  image_color: bgr
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

task:
  max_steps: 800
  obj_paths:
    - path: "/World/conical_bottle02"
      position_range:
        x: [0.21, 0.36]
        y: [-0.08, 0.08]
        z: [0.80, 0.80]

cameras:
  - prim_path: "/World/Camera1"
    name: "image"
    translation: [1.6, 0, 1.85]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Camera2"
    name: "image_2"
    translation: [0.17, 0, 2.3]
    resolution: [256, 256]
    focal_length: 4
    orientation: [0.70711, 0, 0, -0.70711]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "wrist_image"
    resolution: [256, 256]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}